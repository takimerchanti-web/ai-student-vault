kind = "web"
previewPath = "/"
title = "Mohammad Vault"
version = "1.0.0"
id = "artifacts/mohammad-vault"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22556

[services.development]
run = "pnpm --filter @workspace/mohammad-vault run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mohammad-vault", "run", "build" ]
serve = "static"
publicDir = "artifacts/mohammad-vault/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22556"
BASE_PATH = "/"
